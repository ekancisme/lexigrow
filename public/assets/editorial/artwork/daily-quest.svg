<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" fill="#F8FAFC" rx="12"/>

  <!-- Crossword Mini Grid -->
  <g transform="translate(60, 20)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="18" y="24" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">L</text>

    <rect x="40" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="58" y="24" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">E</text>

    <rect x="80" y="0" width="36" height="36" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="98" y="24" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1E40AF">A</text>

    <rect x="120" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="138" y="24" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">R</text>

    <rect x="160" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="178" y="24" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">N</text>

    <!-- Down word intersecting at 'A' -->
    <rect x="80" y="40" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="98" y="64" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">C</text>

    <rect x="80" y="80" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="98" y="104" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">E</text>
  </g>

  <!-- Quest Badge -->
  <rect x="82" y="140" width="156" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="160" y="157" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#B45309">Daily Crossword Quest</text>
</svg>
