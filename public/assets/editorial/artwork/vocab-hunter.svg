<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" fill="#F8FAFC" rx="12"/>

  <!-- Target definition banner -->
  <rect x="24" y="20" width="272" height="40" rx="8" fill="#1E293B"/>
  <text x="160" y="45" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#F8FAFC">Target: "Ability to recover quickly"</text>

  <!-- Moving word bubbles/targets -->
  <g transform="translate(36, 80)">
    <circle cx="40" cy="40" r="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="40" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#475569">Deficit</text>
  </g>

  <g transform="translate(124, 72)">
    <circle cx="40" cy="40" r="36" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="40" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1E40AF">Resilience</text>
    <!-- Crosshair indicator -->
    <circle cx="40" cy="40" r="24" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <g transform="translate(220, 80)">
    <circle cx="40" cy="40" r="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="40" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#475569">Hazard</text>
  </g>
</svg>
