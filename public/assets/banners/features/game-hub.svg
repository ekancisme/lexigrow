<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="45%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="gameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    @keyframes comboBounce {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.08) translateY(-4px); }
    }
    @keyframes cardMatch {
      0%, 100% { border-color: #10B981; }
      50% { border-color: #34D399; }
    }
    @keyframes sparkFloat {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translate(15px, -25px) scale(1.1); opacity: 0; }
    }
    .combo-badge {
      transform-origin: 300px 65px;
      animation: comboBounce 2s ease-in-out infinite;
    }
    .spark-1 { animation: sparkFloat 2.2s infinite ease-out; }
    .spark-2 { animation: sparkFloat 2.8s infinite ease-out 0.8s; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" rx="16" fill="url(#gameBg)" />

  <!-- Neon Accent Circles -->
  <circle cx="80" cy="50" r="70" fill="#F59E0B" fill-opacity="0.1" />
  <circle cx="330" cy="180" r="90" fill="#EF4444" fill-opacity="0.08" />

  <!-- Animated Sparks -->
  <circle cx="280" cy="90" r="3" fill="#FBBF24" class="spark-1" />
  <circle cx="320" cy="110" r="2.5" fill="#F59E0B" class="spark-2" />

  <!-- Game Arena Board -->
  <g transform="translate(24, 24)" filter="url(#gameShadow)">
    <rect width="352" height="212" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />

    <!-- Top HUD Bar -->
    <rect width="352" height="36" rx="14" fill="#1E293B" />
    <!-- Gamepad Icon -->
    <path d="M 22 18 L 26 14 L 38 14 L 42 18 L 40 25 L 34 25 L 32 21 L 28 21 L 26 25 L 20 25 Z" fill="#F59E0B" />
    <circle cx="28" cy="17" r="1.5" fill="#0F172A" />
    <circle cx="34" cy="17" r="1.5" fill="#0F172A" />

    <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">
      Word Matching Arena · Round 3
    </text>

    <!-- Timer Pill -->
    <rect x="270" y="8" width="68" height="20" rx="10" fill="#374151" />
    <circle cx="282" cy="18" r="4" fill="#EF4444" />
    <text x="306" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FBBF24" text-anchor="middle">
      00:42
    </text>

    <!-- Game Cards Grid: 2 columns, 2 pairs matching -->
    <!-- Card 1: English Word (Selected/Matched) -->
    <g transform="translate(20, 52)">
      <rect width="144" height="42" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1.8" />
      <text x="72" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle">
        foster 🟢
      </text>
    </g>

    <!-- Card 2: Definition Match -->
    <g transform="translate(188, 52)">
      <rect width="144" height="42" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1.8" />
      <text x="72" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">
        thúc đẩy, nuôi dưỡng
      </text>
    </g>

    <!-- Card 3: Word 2 -->
    <g transform="translate(20, 104)">
      <rect width="144" height="42" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2" />
      <text x="72" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9" text-anchor="middle">
        mitigate
      </text>
    </g>

    <!-- Card 4: Definition 2 -->
    <g transform="translate(188, 104)">
      <rect width="144" height="42" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2" />
      <text x="72" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">
        giảm nhẹ, xoa dịu
      </text>
    </g>

    <!-- Bottom Combo Banner -->
    <g transform="translate(20, 156)" class="combo-badge">
      <rect width="312" height="42" rx="8" fill="url(#amberGlow)" />
      <text x="35" y="26" font-family="'Segoe UI Emoji', sans-serif" font-size="16">🔥</text>
      <text x="60" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">
        COMBO x5 STREAK!
      </text>
      <text x="280" y="26" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#FEF3C7" text-anchor="middle">
        +350 PTS
      </text>
    </g>
  </g>
</svg>
