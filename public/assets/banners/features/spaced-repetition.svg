<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="srsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="srsCardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-1deg); }
    }
    @keyframes soundWave {
      0%, 100% { height: 6px; }
      50% { height: 18px; }
    }
    @keyframes wave2 {
      0%, 100% { height: 14px; }
      50% { height: 8px; }
    }
    @keyframes brainPulse {
      0%, 100% { transform: scale(1); opacity: 0.15; }
      50% { transform: scale(1.08); opacity: 0.28; }
    }
    .floating-card {
      animation: cardFloat 3.5s ease-in-out infinite;
    }
    .wave-bar-1 { animation: soundWave 1.2s ease-in-out infinite; }
    .wave-bar-2 { animation: wave2 1.4s ease-in-out infinite; }
    .wave-bar-3 { animation: soundWave 1.1s ease-in-out infinite 0.3s; }
    .pulse-bg {
      transform-origin: 200px 130px;
      animation: brainPulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="400" height="260" rx="16" fill="url(#srsBg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="130" r="120" fill="#8B5CF6" class="pulse-bg" />

  <!-- Flashcard Stack Effect Behind -->
  <rect x="74" y="32" width="252" height="152" rx="14" fill="#3B0764" opacity="0.4" transform="rotate(-4 200 108)" />
  <rect x="72" y="30" width="256" height="154" rx="14" fill="#4C1D95" opacity="0.6" transform="rotate(3 200 107)" />

  <!-- Main Active Flashcard -->
  <g class="floating-card" filter="url(#srsCardGlow)">
    <rect x="65" y="30" width="270" height="156" rx="16" fill="url(#cardFrontGrad)" stroke="#7C3AED" stroke-width="1.8" />

    <!-- Card Header Pill -->
    <rect x="85" y="46" width="68" height="20" rx="10" fill="#4338CA" />
    <text x="119" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#E0E7FF" text-anchor="middle">
      C1 · IELTS 7.5+
    </text>

    <!-- Audio Waveform Button -->
    <g transform="translate(290, 56)">
      <circle cx="0" cy="0" r="14" fill="#4F46E5" />
      <rect x="-6" y="-3" width="2.5" height="6" rx="1" fill="#FFFFFF" class="wave-bar-1" />
      <rect x="-2" y="-7" width="2.5" height="14" rx="1" fill="#FFFFFF" class="wave-bar-2" />
      <rect x="2" y="-4" width="2.5" height="8" rx="1" fill="#FFFFFF" class="wave-bar-3" />
      <rect x="6" y="-2" width="2.5" height="4" rx="1" fill="#FFFFFF" class="wave-bar-1" />
    </g>

    <!-- Vocab Word -->
    <text x="85" y="98" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFFFFF">
      Ubiquitous
    </text>
    <!-- Phonetics -->
    <text x="85" y="118" font-family="'Courier New', monospace" font-size="12" fill="#A78BFA">
      /juːˈbɪk.wɪ.təs/ (adj)
    </text>

    <!-- Definition preview -->
    <text x="85" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#E2E8F0">
      Phổ biến, có mặt ở khắp mọi nơi
    </text>

    <line x1="85" y1="156" x2="315" y2="156" stroke="#4C1D95" stroke-width="1" />

    <text x="85" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#C4B5FD">
      Ví dụ: Smartphones have become ubiquitous in modern life.
    </text>
  </g>

  <!-- SM-2 Spaced Schedule Bar Below -->
  <g transform="translate(48, 202)">
    <rect width="304" height="38" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#6D28D9" stroke-width="1" />

    <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">
      SM-2 Interval:
    </text>

    <!-- Interval Pills -->
    <g transform="translate(108, 9)">
      <rect x="0" y="0" width="46" height="20" rx="4" fill="#312E81" />
      <text x="23" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#C7D2FE" text-anchor="middle">1 ngày</text>

      <rect x="52" y="0" width="46" height="20" rx="4" fill="#4338CA" />
      <text x="75" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#E0E7FF" text-anchor="middle">3 ngày</text>

      <rect x="104" y="0" width="46" height="20" rx="4" fill="#7C3AED" />
      <text x="127" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7 ngày ★</text>

      <rect x="156" y="0" width="34" height="20" rx="4" fill="#1E1B4B" />
      <text x="173" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#A5B4FC" text-anchor="middle">+14d</text>
    </g>
  </g>
</svg>
